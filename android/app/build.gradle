plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mijnboodschappen.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mijnboodschappen.app'
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }
}

dependencies {

    // AndroidX Activity
    implementation 'androidx.activity:activity:1.10.1'

    // AndroidX Core / SplashScreen
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // WebView asset loader: secure HTTPS origin for camera access
    implementation 'androidx.webkit:webkit:1.13.0'
}
