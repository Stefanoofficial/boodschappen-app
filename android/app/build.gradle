plugins {
    id 'com.android.application'
}

// Sleutel voor de Play Store-versie. Codemagic vult deze gegevens zelf in
// (Team settings → Code signing identities). Zonder sleutel bouwt de app gewoon de test-APK.
def keystorePath = System.getenv("CM_KEYSTORE_PATH")

// Elke upload naar Google Play heeft een hoger intern nummer nodig. De versie die
// gebruikers zien blijft 1.0.0.
def buildNumber = System.getenv("BUILD_NUMBER")
def appVersionCode = buildNumber ? (buildNumber as int) + 10 : 3

android {
    namespace 'com.mijnboodschappen.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.mijnboodschappen.app'
        minSdk 24
        targetSdk 36

        versionCode appVersionCode
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                keyAlias System.getenv("CM_KEY_ALIAS")
                keyPassword System.getenv("CM_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-splashscreen:1.0.1'
    // Betalen voor Pro via Google Play
    implementation 'com.android.billingclient:billing:8.0.0'
    // Inloggen met Google (Android Credential Manager)
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}

// De losse oude Kotlin-onderdelen (jdk7/jdk8) zitten sinds Kotlin 1.8 al in kotlin-stdlib.
// Weglaten voorkomt "Duplicate class kotlin..." bij het bouwen.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
