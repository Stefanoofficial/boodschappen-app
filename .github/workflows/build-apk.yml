name: Mijn Boodschappen APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: APK bouwen
    runs-on: ubuntu-latest

    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Java installeren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      - name: Android SDK instellen
        uses: android-actions/setup-android@v4

      - name: Android app voorbereiden
        shell: bash
        run: |
          set -e

          test -d android
          test -f android/gradlew
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/com/mijnboodschappen/app/MainActivity.java

          test -f index.html
          test -f splash_icon.png
          test -f icon-512-maskable.png

          # Maak dezelfde gegenereerde resources als Codemagic.
          rm -rf android/app/src/main/res

          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          if [ -d recipes ]; then mkdir -p android/app/src/main/assets/recipes && cp -r recipes/. android/app/src/main/assets/recipes/; fi

          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-${density}"
          done

          cp splash_icon.png android/app/src/main/res/drawable/splash_icon.png
          cp splash_icon.png android/app/src/main/res/drawable/android_system_splash_icon.png
          cp splash_icon.png android/app/src/main/res/drawable/ic_launcher_foreground.png

          # Soepel draaiend ringetje op het opstartscherm.
          cat > android/app/src/main/res/drawable/splash_ring_anim.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <animated-vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt">
              <aapt:attr name="android:drawable">
                  <vector
                      android:width="230dp"
                      android:height="230dp"
                      android:viewportWidth="230"
                      android:viewportHeight="230">
                      <group
                          android:name="spin"
                          android:pivotX="115"
                          android:pivotY="115">
                          <path
                              android:pathData="M115,11 A104,104 0 0,1 212.73,79.43"
                              android:strokeColor="#FF14BE4B"
                              android:strokeWidth="5"
                              android:strokeLineCap="round"
                              android:fillColor="#00000000" />
                      </group>
                  </vector>
              </aapt:attr>
              <target android:name="spin">
                  <aapt:attr name="android:animation">
                      <objectAnimator
                          android:propertyName="rotation"
                          android:valueFrom="0"
                          android:valueTo="360"
                          android:valueType="floatType"
                          android:duration="800"
                          android:repeatCount="infinite"
                          android:repeatMode="restart"
                          android:interpolator="@android:anim/linear_interpolator" />
                  </aapt:attr>
              </target>
          </animated-vector>
          EOF

          # Monochroom statusbalk-icoon voor Android-meldingen.
          cat > android/app/src/main/res/drawable/ic_notification.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M12,22c1.1,0 2,-0.9 2,-2h-4c0,1.1 0.9,2 2,2zM18,16v-5c0,-3.07 -1.63,-5.64 -4.5,-6.32V4a1.5,1.5 0,0 0,-3 0v0.68C7.63,5.36 6,7.92 6,11v5l-2,2v1h16v-1z" />
          </vector>
          EOF

          cat > android/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="icon_green">#14BE4B</color>
          </resources>
          EOF

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icon_green" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icon_green" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBar"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#14BE4B</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:navigationBarColor">#eef8f1</item>
                  <item name="android:statusBarColor">#eef8f1</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowLightNavigationBar">true</item>
              </style>

              <style name="AppTheme.Splash" parent="Theme.SplashScreen">
                  <item name="windowSplashScreenBackground">#eef8f1</item>
                  <item name="windowSplashScreenAnimatedIcon">@drawable/android_system_splash_icon</item>
                  <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
              </style>
          </resources>
          EOF

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icon-512-maskable.png \
              "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp icon-512-maskable.png \
              "android/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done

          # Controleer of de benodigde resources bestaan.
          test -f android/app/src/main/assets/index.html
          test -f android/app/src/main/res/values/styles.xml
          test -f android/app/src/main/res/drawable/ic_notification.xml
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png

          echo "Android resources voorbereid."

      - name: Android SDK locatie instellen
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Android APK bouwen
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --build-cache --stacktrace

      - name: APK beschikbaar maken
        uses: actions/upload-artifact@v4
        with:
          name: Mijn-Boodschappen-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
