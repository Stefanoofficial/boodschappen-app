workflows:
  android-apk:
    name: Android APK
    instance_type: mac_mini_m2

    scripts:

      - name: Prepare Android resources
        script: |
          set -e

          echo "=== BUILD DIRECTORY ==="
          pwd

          echo "=== ROOT FILES ==="
          ls -lab

          echo "=== FIND ICON ==="

          ICON_FILE="$(find "$CM_BUILD_DIR" -maxdepth 1 -type f -name '*icon-512-maskable.png' -print -quit)"

          if [ -z "$ICON_FILE" ]; then
            echo "ERROR: icon-512-maskable.png could not be found"
            echo "Available PNG files:"
            find "$CM_BUILD_DIR" -maxdepth 1 -type f -name '*.png' -print
            exit 1
          fi

          echo "ICON FOUND:"
          printf '%s\n' "$ICON_FILE"

          echo "=== CREATE RESOURCE DIRECTORY ==="
          mkdir -p "$CM_BUILD_DIR/android/app/src/main/res/drawable"

          echo "=== COPY ICON ==="
          cp "$ICON_FILE" \
             "$CM_BUILD_DIR/android/app/src/main/res/drawable/ic_launcher.png"

          echo "=== VERIFY ICON ==="
          ls -lh "$CM_BUILD_DIR/android/app/src/main/res/drawable/ic_launcher.png"
      - name: Build Android APK
        script: |
          set -e

          cd "$CM_BUILD_DIR/android"

          chmod +x gradlew

          ./gradlew assembleDebug

          echo "=== APK ==="
          find app/build/outputs/apk -type f -name "*.apk" -print

    artifacts:
      - android/app/build/outputs/apk/**/*.apk
