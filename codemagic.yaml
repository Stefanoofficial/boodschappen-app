workflows:
  android-apk:
    name: Android APK
    instance_type: mac_mini_m2

    scripts:

      - name: Prepare Android resources
        script: |
          set -e

          echo "=== CREATE ANDROID RESOURCE DIRECTORIES ==="

          mkdir -p "$CM_BUILD_DIR/android/app/src/main/res/drawable"

          echo "=== CHECK ICON ==="

          if [ ! -f "$CM_BUILD_DIR/icon-512-maskable.png" ]; then
            echo "ERROR: $CM_BUILD_DIR/icon-512-maskable.png not found"
            exit 1
          fi

          echo "Icon found:"
          ls -lh "$CM_BUILD_DIR/icon-512-maskable.png"

          echo "=== INSTALL APP ICON ==="

          cp "$CM_BUILD_DIR/icon-512-maskable.png" \
             "$CM_BUILD_DIR/android/app/src/main/res/drawable/ic_launcher.png"

          echo "=== VERIFY ANDROID ICON ==="

          ls -lh "$CM_BUILD_DIR/android/app/src/main/res/drawable/ic_launcher.png"

          echo "=== ANDROID RESOURCES READY ==="


      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"


      - name: Verify Android Manifest
        script: |
          set -e

          echo "=== ANDROID MANIFEST ==="
          cat "$CM_BUILD_DIR/android/app/src/main/AndroidManifest.xml"

          echo "=== CHECK LAUNCHER ICON ==="

          if [ ! -f "$CM_BUILD_DIR/android/app/src/main/res/drawable/ic_launcher.png" ]; then
            echo "ERROR: ic_launcher.png was not created"
            exit 1
          fi

          echo "Launcher icon OK"


      - name: Build Android APK
        script: |
          set -e

          cd "$CM_BUILD_DIR/android"

          chmod +x ./gradlew

          ./gradlew assembleDebug


    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
