workflows:
  android-apk:
    name: Boodschappen App APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Check Android resources
  script: |
    echo "=== RES FOLDER ==="
    ls -la android/app/src/main/res

    echo "=== DRAWABLE ==="
    ls -la android/app/src/main/res/drawable

    echo "=== LAUNCHER FILE ==="
    ls -la android/app/src/main/res/drawable/ic_launcher.png

    echo "=== FILE TYPE ==="
    file android/app/src/main/res/drawable/ic_launcher.png

      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/**/*.apk
