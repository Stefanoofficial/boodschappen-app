workflows:
  android-apk:
    name: Android APK - Mijn Boodschappen
    instance_type: mac_mini_m2

    scripts:

      - name: Prepare Android app
        script: |
          #!/usr/bin/env bash
          set -e

          echo "========================================"
          echo "       PREPARE ANDROID APP"
          echo "========================================"

          echo "=== ROOT ==="
          pwd
          ls -la

          echo "=== CHECK ANDROID PROJECT ==="
          test -d android
          test -f android/gradlew
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/com/mijnboodschappen/app/MainActivity.java
          test -f index.html
          test -f splash_icon.png
          test -f icon-512-maskable.png
          test -f android_system_splash_icon.png
          test -f ic_launcher_foreground.png

          echo "=== CLEAN OLD GENERATED RESOURCE PATH ==="
          rm -rf "android/app/src/main/    res"

          echo "=== PREPARE WEB ASSET ==="
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

          echo "=== PREPARE RESOURCE DIRECTORIES ==="
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26

          echo "=== PREPARE CUSTOM SPLASH ==="
          cp splash_icon.png android/app/src/main/res/drawable/splash_icon.png

          echo "=== PREPARE SMALL ANDROID SYSTEM SPLASH ==="
          cp android_system_splash_icon.png             android/app/src/main/res/drawable/android_system_splash_icon.png

          echo "=== PREPARE LESS-ZOOMED ADAPTIVE ICON FOREGROUND ==="
          cp ic_launcher_foreground.png             android/app/src/main/res/drawable/ic_launcher_foreground.png

          echo "=== PREPARE ICON COLORS ==="
          cat > android/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="icon_green">#14BE4B</color>
          </resources>
          EOF

          echo "=== PREPARE ADAPTIVE ICON ==="
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icon_green" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icon_green" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          echo "=== PREPARE SPLASH THEME ==="
          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme.NoActionBar"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#14BE4B</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowNoTitle">true</item>

                  <item name="android:navigationBarColor">#eef8f1</item>
                  <item name="android:statusBarColor">#eef8f1</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowLightNavigationBar">true</item>
              </style>

              <style name="AppTheme.Splash" parent="Theme.SplashScreen">
                  <item name="windowSplashScreenBackground">#eef8f1</item>
                  <item name="windowSplashScreenAnimatedIcon">@drawable/android_system_splash_icon</item>
                  <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
              </style>

          </resources>
          EOF

          echo "=== PREPARE MIPMAP ICONS ==="
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          cp icon-512-maskable.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp icon-512-maskable.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp icon-512-maskable.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp icon-512-maskable.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp icon-512-maskable.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp icon-512-maskable.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp icon-512-maskable.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp icon-512-maskable.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp icon-512-maskable.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp icon-512-maskable.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          echo "=== VERIFY RESOURCES ==="
          test -f android/app/src/main/res/drawable/android_system_splash_icon.png
          test -f android/app/src/main/res/drawable/ic_launcher_foreground.png
          test -f android/app/src/main/res/drawable/splash_icon.png
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/values/styles.xml

          echo "========================================"
          echo "       PREPARATION COMPLETE"
          echo "========================================"

      - name: Set Android SDK location
        script: |
          set -e
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
          cat "$CM_BUILD_DIR/android/local.properties"

      - name: Build Android APK
        script: |
          set -e
          cd "$CM_BUILD_DIR/android"
          chmod +x ./gradlew
          ./gradlew clean
          ./gradlew assembleDebug
          find app/build/outputs/apk/debug -type f -name "*.apk" -print

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
