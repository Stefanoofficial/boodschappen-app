workflows:
  android-apk:
    name: Android APK
    instance_type: mac_mini_m2

    scripts:

      - name: Prepare Android app
        script: |
          #!/usr/bin/env bash

          set -e

          echo "=== BUILD DIRECTORY ==="
          pwd

          echo "=== ROOT FILES ==="
          ls -la

          echo "=== CHECK INDEX ==="
          test -f index.html

          echo "=== CHECK APP ICON ==="
          test -f icon-512-maskable.png

          echo "=== CHECK SPLASH ICON ==="
          test -f splash_icon.png

          echo "=== PREPARE WEB ASSET ==="
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

          echo "=== PREPARE ANDROID DRAWABLE ==="
          mkdir -p android/app/src/main/res/drawable

          echo "=== COPY APP ICON ==="
          cp icon-512-maskable.png \
             android/app/src/main/res/drawable/ic_launcher.png

          echo "=== COPY SPLASH ICON ==="
          cp splash_icon.png \
             android/app/src/main/res/drawable/splash_icon.png

          echo "=== PREPARE VALUES DIRECTORY ==="
          mkdir -p android/app/src/main/res/values

          echo "=== CREATE STYLES.XML ==="
          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme.NoActionBar"
                  parent="@android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowBackground">#eef8f1</item>
                  <item name="android:colorAccent">#4f7658</item>
                  <item name="android:statusBarColor">#eef8f1</item>
                  <item name="android:navigationBarColor">#eef8f1</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowLightNavigationBar">true</item>

              </style>

              <style name="AppTheme.Splash"
                  parent="Theme.SplashScreen">

                  <item name="windowSplashScreenBackground">#FFFFFF</item>
                  <item name="windowSplashScreenAnimatedIcon">@drawable/splash_icon</item>
                  <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>

              </style>

          </resources>
          EOF

          echo "=== CHECK PREPARED FILES ==="
          ls -l android/app/src/main/assets/index.html
          ls -l android/app/src/main/res/drawable/ic_launcher.png
          ls -l android/app/src/main/res/drawable/splash_icon.png
          ls -l android/app/src/main/res/values/styles.xml

          echo "=== ANDROID DRAWABLE FILES ==="
          ls -la android/app/src/main/res/drawable/


      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"


      - name: Build Android APK
        script: |
          set -e

          cd "$CM_BUILD_DIR/android"

          chmod +x ./gradlew

          ./gradlew assembleDebug


    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
