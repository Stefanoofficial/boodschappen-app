workflows:
  android-apk:
    name: Android APK
    instance_type: mac_mini_m2

    environment:
      android_signing:
        - keystore_reference

    scripts:
      - name: Prepare Android resources
        script: |
          echo "=== BUILD DIRECTORY ==="
          pwd
          echo "=== ROOT FILES ==="
          ls -la

          echo "=== CHECK ICON ==="
          if [ ! -f "icon-512-maskable.png" ]; then
            echo "ERROR: icon-512-maskable.png not found"
            exit 1
          fi

          mkdir -p android/app/src/main/res/drawable
          cp icon-512-maskable.png android/app/src/main/res/drawable/ic_launcher.png

          echo "=== ICON READY ==="
          ls -l android/app/src/main/res/drawable/ic_launcher.png

      - name: Build Android APK
        script: |
          cd android
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
