workflows:
  android-apk:
    name: Android APK
    instance_type: mac_mini_m2

    scripts:

      - name: Prepare web assets and Android resources
        script: |
          #!/usr/bin/env bash

          set -e

          echo "=== BUILD DIRECTORY ==="
          pwd

          echo "=== ROOT FILES ==="
          ls -la

          echo "=== CHECK INDEX ==="
          test -f index.html

          echo "=== CHECK ICON ==="
          test -f icon-512-maskable.png

          echo "=== PREPARE WEB ASSET ==="
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

          echo "=== PREPARE ICON ==="
          mkdir -p android/app/src/main/res/drawable
          cp icon-512-maskable.png android/app/src/main/res/drawable/ic_launcher.png

          echo "=== CHECK PREPARED FILES ==="
          ls -l android/app/src/main/assets/index.html
          ls -l android/app/src/main/res/drawable/ic_launcher.png


      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"


      - name: Build Android APK
        script: |
          set -e

          cd "$CM_BUILD_DIR/android"

          chmod +x ./gradlew

          ./gradlew assembleDebug


    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
