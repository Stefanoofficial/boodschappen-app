workflows:
  android-apk:
    name: Android APK
    instance_type: mac_mini_m2

    environment:
      vars:
        PACKAGE_NAME: "com.mijnboodschappen.app"
      android_signing:
        - keystore_reference

    scripts:

      - name: Check project files
        script: |
          set -e

          echo "=== CURRENT DIRECTORY ==="
          pwd

          echo "=== ROOT FILES ==="
          ls -la

          echo "=== ANDROID PROJECT ==="
          ls -la android
          ls -la android/app

          echo "=== CHECK ICON ==="
          if [ ! -f "./icon-512-maskable.png" ]; then
            echo "ERROR: ./icon-512-maskable.png not found"
            echo "PNG FILES:"
            find . -maxdepth 2 -type f -name "*.png" -print
            exit 1
          fi

          echo "ICON FOUND:"
          ls -lh "./icon-512-maskable.png"

      - name: Prepare Android resources
        script: |
          set -e

          echo "=== CREATE ANDROID RESOURCE DIRECTORIES ==="

          mkdir -p android/app/src/main/res/drawable

          echo "=== COPY APP ICON ==="

          cp "./icon-512-maskable.png" \
             "android/app/src/main/res/drawable/ic_launcher.png"

          echo "=== VERIFY ICON ==="

          ls -lh android/app/src/main/res/drawable/ic_launcher.png

          file android/app/src/main/res/drawable/ic_launcher.png

      - name: Set Android SDK location
        script: |
          set -e

          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

          echo "=== ANDROID SDK ==="
          cat android/local.properties

      - name: Verify Android Manifest
        script: |
          set -e

          echo "=== ANDROID MANIFEST ==="
          cat android/app/src/main/AndroidManifest.xml

          echo "=== VERIFY LAUNCHER ICON ==="

          if grep -q 'drawable/ic_launcher' android/app/src/main/AndroidManifest.xml; then
            echo "Launcher icon reference found."
          else
            echo "WARNING: drawable/ic_launcher reference not found in manifest."
          fi

          echo "=== VERIFY ICON FILE ==="

          test -f android/app/src/main/res/drawable/ic_launcher.png

          echo "Launcher icon exists."

      - name: Build Android APK
        script: |
          set -e

          cd android

          chmod +x gradlew

          echo "=== GRADLE VERSION ==="
          ./gradlew --version

          echo "=== BUILD DEBUG APK ==="
          ./gradlew assembleDebug --stacktrace

          echo "=== APK FILES ==="
          find app/build/outputs/apk -type f -name "*.apk" -print

    artifacts:
      - android/app/build/outputs/apk/**/*.apk
