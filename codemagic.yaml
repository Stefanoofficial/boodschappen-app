workflows:
  android-apk:
    name: Boodschappen App APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    scripts:
      - name: Prepare Android resources
        script: |
          set -e

          echo "=== CURRENT DIRECTORY ==="
          pwd

          echo "=== ROOT FILES ==="
          ls -la

          echo "=== ANDROID PROJECT ==="
          ls -la android
          ls -la android/app

          echo "=== CREATE ANDROID RESOURCE DIRECTORIES ==="
          mkdir -p android/app/src/main/res/drawable

          echo "=== CHECK ICON ==="
          if [ -f "icon-512-maskable.png" ]; then
            echo "Found icon-512-maskable.png"
          else
            echo "ERROR: icon-512-maskable.png not found"
            exit 1
          fi

          echo "=== INSTALL LAUNCHER ICON ==="
          cp icon-512-maskable.png \
            android/app/src/main/res/drawable/ic_launcher.png

          cp icon-512-maskable.png \
            android/app/src/main/res/drawable/ic_launcher_round.png

          echo "=== ANDROID RESOURCES ==="
          find android/app/src/main/res -type f -print

      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Verify Android Manifest
        script: |
          set -e

          echo "=== ANDROID MANIFEST ==="
          cat android/app/src/main/AndroidManifest.xml

          echo "=== LAUNCHER ICONS ==="
          ls -lh android/app/src/main/res/drawable/

      - name: Build Android APK
        script: |
          set -e

          cd android

          chmod +x gradlew

          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/**/*.apk
