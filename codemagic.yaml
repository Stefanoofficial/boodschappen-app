workflows:
  android-apk:
    name: Android APK
    instance_type: mac_mini_m2

    scripts:

      - name: Prepare Android resources
        script: |
          set -e

          echo "=== BUILD DIRECTORY ==="
          pwd

          echo "=== ROOT FILES ==="
          ls -la

          echo "=== CHECK ICON ==="
          test -f "$CM_BUILD_DIR/icon-512-maskable.png"

          echo "=== CREATE RESOURCE DIRECTORY ==="
          mkdir -p "$CM_BUILD_DIR/android/app/src/main/res/drawable"

          echo "=== COPY ICON ==="
          cp "$CM_BUILD_DIR/icon-512-maskable.png" \
             "$CM_BUILD_DIR/android/app/src/main/res/drawable/ic_launcher.png"

          echo "=== VERIFY ICON ==="
          ls -lh "$CM_BUILD_DIR/android/app/src/main/res/drawable/ic_launcher.png"

      - name: Set Android SDK location
        script: |
          set -e

          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Build Android APK
        script: |
          set -e

          cd "$CM_BUILD_DIR/android"

          chmod +x gradlew

          ./gradlew assembleDebug

          echo "=== APK ==="
          find app/build/outputs/apk -type f -name "*.apk" -print

    artifacts:
      - android/app/build/outputs/apk/**/*.apk
