workflows:
  android-apk:
    name: Android APK
    instance_type: mac_mini_m2

    scripts:

      - name: Prepare Android resources
        script: |
          set -e

          echo "=== BUILD DIRECTORY ==="
          pwd

          echo "=== ROOT FILES ==="
          ls -la "$CM_BUILD_DIR"

          mkdir -p "$CM_BUILD_DIR/android/app/src/main/res/drawable"

          echo "=== FIND ICON ==="

          ICON=$(find "$CM_BUILD_DIR" -maxdepth 2 -name "icon-512-maskable.png" -type f | head -1)

          if [ -z "$ICON" ]; then
            echo "ERROR: icon-512-maskable.png not found"
            echo "Searching for all PNG files:"
            find "$CM_BUILD_DIR" -maxdepth 3 -name "*.png" -type f -print
            exit 1
          fi

          echo "Found icon:"
          echo "$ICON"

          cp "$ICON" \
            "$CM_BUILD_DIR/android/app/src/main/res/drawable/ic_launcher.png"

          echo "=== INSTALLED ICON ==="
          ls -lh "$CM_BUILD_DIR/android/app/src/main/res/drawable/ic_launcher.png"


      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"


      - name: Verify Android resources
        script: |
          set -e

          test -f "$CM_BUILD_DIR/android/app/src/main/res/drawable/ic_launcher.png"

          echo "=== ANDROID ICON OK ==="
          ls -lh "$CM_BUILD_DIR/android/app/src/main/res/drawable/ic_launcher.png"


      - name: Build Android APK
        script: |
          set -e

          cd "$CM_BUILD_DIR/android"

          chmod +x ./gradlew

          ./gradlew assembleDebug


    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
